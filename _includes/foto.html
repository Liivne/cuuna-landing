{%- comment -%}
  Foto con marcador: si "src" está vacío se ve el isotipo con la etiqueta.
  Parámetros: src, label, clase, alt, carga ("eager" para la portada).
{%- endcomment -%}
{%- if include.src and include.src != "" -%}
<figure class="photo {{ include.clase }}">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="{{ include.carga | default: 'lazy' }}">
</figure>
{%- else -%}
<figure class="photo {{ include.clase }}" data-label="{{ include.label }}"></figure>
{%- endif -%}
