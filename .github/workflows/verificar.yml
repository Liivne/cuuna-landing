# Compila el sitio con el mismo constructor de GitHub Pages en cualquier rama que no
# sea main, para revisar cambios antes de publicarlos. El resultado queda como
# artefacto "sitio" en la ejecución (no se publica).
name: Verificar sitio

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: _site
          retention-days: 7
