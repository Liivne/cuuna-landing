title: Alianzas
eyebrow: Sobre CUUNA
grupo: sobre
lead: Organizaciones con las que trabajamos para llevar los MUN a más jóvenes.
---
<section class="section">
  <div class="wrap">
    <div class="partners">
      {%- for a in site.data.alianzas %}
      <a class="partner" href="{{ a.enlace }}" target="_blank" rel="noopener">
        {%- if a.logo and a.logo != "" %}<img src="{{ a.logo | relative_url }}" alt="" width="64" height="64" loading="lazy">{% endif %}
        <span>{{ a.nombre }}</span>
        {% include icono.html nombre="flecha" %}
      </a>
      {%- endfor %}
    </div>
  </div>
</section>
