<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <title>El sitio de CUUNA se mudó</title>
  <meta name="robots" content="noindex">
  <script>
    // Cualquier otra dirección antigua (/cuuna-landing/...) va a la misma ruta en Vercel.
    var ruta = location.pathname.replace(/^\/cuuna-landing/, "") || "/";
    location.replace("https://cuuna.cl" + ruta + location.search + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://cuuna.cl/"></noscript>
</head>
<body>
  <p>El sitio de CUUNA se mudó a <a href="https://cuuna.cl/">https://cuuna.cl</a>.</p>
</body>
</html>
