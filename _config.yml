title: CUUNA
nombre_completo: Chilean Universities United Nations Association
description: >-
  CUUNA es una ONG chilena que promueve los Modelos de Naciones Unidas, las relaciones
  internacionales y los valores de la ONU en las juventudes de Chile.
lang: es-CL

# Dirección pública (Vercel sirve el sitio desde la raíz, sin subcarpeta).
url: ""
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM   # Markdown al estilo GitHub

collections:
  noticias:
    output: true
    permalink: /noticias/:name/

defaults:
  - scope:
      path: ""
      type: noticias
    values:
      layout: noticia
      seccion: /noticias.html

exclude:
  - LEEME.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - .vercel
  - vercel.json
  - .vercelignore
