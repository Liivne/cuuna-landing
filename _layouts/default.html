<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title }} · {{ site.nombre_completo }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.resumen | default: page.lead | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#37b2f8">
  <link rel="icon" type="image/png" href="{{ '/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>

  {% include header.html %}

  <main id="contenido">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
