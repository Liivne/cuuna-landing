# Equipo 2026–2027, agrupado por órgano (en el orden de "¿Cómo se estructura?").
#
# Cada órgano tiene:
#   id           → ancla en la página (equipo.html#id); no cambiar
#   nombre       → título de la sección
#   descripcion  → opcional; vacío = no se muestra
#   integrantes  → lista de personas. Vacía ([]) = "Pronto presentaremos a sus integrantes."
#
# Cada integrante: cargo, nombre (vacío = "Próximamente"), descripcion (opcional) y
# foto (cuadrada, p. ej. /img/equipo/nombre-apellido.jpg; vacía = marcador).

- id: directorio
  nombre: Directorio
  descripcion: "Dirige y administra la institución. Sus integrantes son elegidos cada año por la Asamblea General, pueden ser reelegidos hasta dos veces y deciden de forma democrática: un integrante, un voto."
  integrantes:
    - cargo: Presidencia
      nombre: Juan Pablo Muñoz
      descripcion: ""
      foto: /img/equipo/juan-pablo-munoz.jpg
    - cargo: Vicepresidencia
      nombre: Juana Pina Molinari
      descripcion: ""
      foto: /img/equipo/juana-pina.jpg
    - cargo: Secretaría
      nombre: Francisco Díaz
      descripcion: ""
      foto: /img/equipo/francisco-diaz.jpg
    - cargo: Tesorería
      nombre: Felipe Payero
      descripcion: ""
      foto: /img/equipo/felipe-payero.jpg
    - cargo: Dirección
      nombre: Emilia Araneda
      descripcion: ""
      foto: /img/equipo/emilia-araneda.jpg
    - cargo: Dirección
      nombre: Naira Duarte
      descripcion: ""
      foto: /img/equipo/naira-duarte.jpg
    - cargo: Dirección
      nombre: Victoria Quintero
      descripcion: ""
      foto: /img/equipo/victoria-quintero.jpg

